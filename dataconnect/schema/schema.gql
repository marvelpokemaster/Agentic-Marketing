type Product @table(name: "products") {
  id: UUID! @default(expr: "uuidV4()")
  userId: String! @col(name: "user_id")
  name: String!
  description: String! @default(value: "")
  features: Any! @default(value: "[]")
  targetAudience: String! @col(name: "target_audience") @default(value: "")
  industry: String! @default(value: "")
  logoUrl: String @col(name: "logo_url")
  imageUrls: Any! @col(name: "image_urls") @default(value: "[]")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
}

type Campaign @table(name: "campaigns") {
  id: UUID! @default(expr: "uuidV4()")
  userId: String! @col(name: "user_id")
  product: Product!
  productName: String! @col(name: "product_name") @default(value: "")
  platforms: Any! @default(value: "[]")
  status: String! @default(value: "draft")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")

  workflow: String! @default(value: "organic_campaign")
  config: Any! @default(value: "{}")
  results: Any! @default(value: "{}")
}

type CampaignAsset @table(name: "campaign_assets") {
  id: UUID! @default(expr: "uuidV4()")
  campaign: Campaign!
  platform: String!
  headline: String! @default(value: "")
  body: String! @default(value: "")
  hashtags: Any! @default(value: "[]")
  cta: String! @default(value: "")
  creativePrompt: String! @col(name: "creative_prompt") @default(value: "")
  creativeUrl: String @col(name: "creative_url")
  status: String! @default(value: "draft")
  scheduledTime: Timestamp @col(name: "scheduled_time")
  externalId: String @col(name: "external_id")
  error: String
}
