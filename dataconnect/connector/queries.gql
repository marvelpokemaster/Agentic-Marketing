query ListProducts @auth(level: USER) {
  products(where: { userId: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }]) {
    id
    userId
    name
    description
    features
    targetAudience
    industry
    logoUrl
    imageUrls
    createdAt
  }
}

query GetProduct($id: UUID!) @auth(level: USER) {
  product(id: $id) {
    id
    userId
    name
    description
    features
    targetAudience
    industry
    logoUrl
    imageUrls
    createdAt
  }
}

query ListCampaigns @auth(level: USER) {
  campaigns(where: { userId: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }]) {
    id
    userId
    product {
      id
      name
    }
    productName
    platforms
    status
    createdAt
    workflow
    config
    results
  }
}

query GetCampaign($id: UUID!) @auth(level: USER) {
  campaign(id: $id) {
    id
    userId
    product {
      id
      name
    }
    productName
    platforms
    status
    createdAt
    workflow
    config
    results
    campaignAssets_on_campaign {
      id
      platform
      headline
      body
      hashtags
      cta
      creativePrompt
      creativeUrl
      status
      scheduledTime
      externalId
      error
    }
  }
}
