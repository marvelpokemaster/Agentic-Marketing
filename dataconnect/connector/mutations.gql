mutation CreateProduct(
  $name: String!,
  $description: String!,
  $features: Any!,
  $targetAudience: String!,
  $industry: String!,
  $imageUrls: Any!
) @auth(level: USER) {
  product_insert(data: {
    userId_expr: "auth.uid",
    name: $name,
    description: $description,
    features: $features,
    targetAudience: $targetAudience,
    industry: $industry,
    imageUrls: $imageUrls
  })
}

mutation CreateCampaign(
  $productId: UUID!,
  $productName: String!,
  $platforms: Any!,
  $status: String!,
  $workflow: String!,
  $config: Any!,
  $results: Any!
) @auth(level: USER) {
  campaign_insert(data: {
    userId_expr: "auth.uid",
    productId: $productId,
    productName: $productName,
    platforms: $platforms,
    status: $status,
    workflow: $workflow,
    config: $config,
    results: $results
  })
}

mutation CreateCampaignAsset(
  $campaignId: UUID!,
  $platform: String!,
  $headline: String!,
  $body: String!,
  $hashtags: Any!,
  $cta: String!,
  $creativePrompt: String!,
  $status: String!
) @auth(level: USER) {
  campaignAsset_insert(data: {
    campaignId: $campaignId,
    platform: $platform,
    headline: $headline,
    body: $body,
    hashtags: $hashtags,
    cta: $cta,
    creativePrompt: $creativePrompt,
    status: $status
  })
}

mutation UpdateCampaignStatus($id: UUID!, $status: String!) @auth(level: USER) {
  campaign_update(id: $id, data: { status: $status })
}

mutation UpdateCampaignResults($id: UUID!, $results: Any!, $status: String) @auth(level: USER) {
  # Note: if status is null, it won't update it directly unless dynamic update is used.
  # We might need two separate mutations or just update all provided.
  campaign_update(id: $id, data: { results: $results, status: $status })
}

mutation UpdateCampaignAsset(
  $id: UUID!,
  $headline: String,
  $body: String,
  $hashtags: Any,
  $cta: String,
  $creativeUrl: String,
  $status: String,
  $scheduledTime: Timestamp,
  $externalId: String,
  $error: String
) @auth(level: USER) {
  campaignAsset_update(id: $id, data: {
    headline: $headline,
    body: $body,
    hashtags: $hashtags,
    cta: $cta,
    creativeUrl: $creativeUrl,
    status: $status,
    scheduledTime: $scheduledTime,
    externalId: $externalId,
    error: $error
  })
}
